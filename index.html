<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QL1A — tuyến, cầu và hạ tầng</title>
  <style>
    :root {
      --bg: #0c1c2e;
      --ink: #e8f4fb;
      --muted: #9eb6c9;
      --line: rgba(78, 206, 236, 0.38);
      --glass: rgba(8, 22, 36, 0.92);
      --amber: #e0b15a;
      --cyan: #3ec8ea;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
    canvas { display: block; touch-action: none; }
    button, input { font: inherit; color: inherit; }
    header, nav, aside, footer { position: fixed; z-index: 2; }
    header {
      left: 16px; top: 14px; padding: 10px 14px 12px; max-width: 320px;
      border: 1px solid var(--line); border-radius: 4px; background: var(--glass);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
    }
    .kicker { margin: 0; color: var(--cyan); font-size: 11px; letter-spacing: 0.16em; }
    h1 { margin: 2px 0 0; font-size: 20px; font-weight: 650; letter-spacing: 0.02em; }
    #status { margin: 4px 0 0; color: var(--muted); max-width: 280px; }
    #views, #tools { display: flex; flex-direction: column; gap: 6px; }
    #views { left: 16px; top: 132px; }
    #tools { right: 16px; top: 16px; }
    button.nav, button.tool {
      width: 148px; text-align: left; cursor: pointer;
      background: rgba(8, 22, 36, 0.9); border: 1px solid rgba(62, 200, 234, 0.42);
      border-radius: 3px; padding: 8px 12px; color: #d7eaf6;
      box-shadow: inset 0 0 0 1px rgba(62, 200, 234, 0.05);
      transition: color 0.18s ease, border-color 0.18s ease, background 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
    }
    #tools button.tool { text-align: right; }
    button.nav:hover, button.tool:hover {
      color: white; border-color: var(--cyan); transform: translateY(-1px);
    }
    button.nav[aria-pressed="true"], button.tool[aria-pressed="true"] {
      color: var(--cyan); border-color: var(--cyan);
      background: rgba(62, 200, 234, 0.16);
      box-shadow: 0 0 16px rgba(62, 200, 234, 0.2);
    }
    #filters {
      left: 16px; top: 318px; width: 248px; max-height: calc(100vh - 400px); overflow: auto;
      padding: 12px 12px 8px; border: 1px solid var(--line); border-radius: 4px;
      background: var(--glass); backdrop-filter: blur(8px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
    }
    #filters.hidden { display: none; }
    #filters h2 { margin: 12px 0 6px; color: var(--cyan); font-size: 11px; font-weight: 650; letter-spacing: 0.14em; }
    #filters h2:first-child { margin-top: 0; }
    #filters .hint { margin: 0 0 4px; color: var(--muted); font-size: 12px; }
    .chips { display: flex; flex-direction: column; gap: 2px; }
    button.chip {
      display: flex; align-items: center; gap: 10px; width: 100%;
      border: 0; background: transparent; color: #8ea2b6;
      border-radius: 8px; padding: 6px 4px; cursor: pointer; font-size: 14px; text-align: left;
    }
    button.chip .knob {
      width: 36px; height: 20px; border-radius: 99px; background: #243646; position: relative; flex: none;
    }
    button.chip .knob::after {
      content: ""; position: absolute; width: 14px; height: 14px; border-radius: 50%;
      background: #9aafc2; top: 3px; left: 3px;
      transition: transform 0.18s ease, background 0.18s ease;
    }
    button.chip .swatch {
      width: 12px; height: 12px; border-radius: 3px; flex: none;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35);
    }
    button.chip em { margin-left: auto; font-style: normal; color: #6e8498; font-variant-numeric: tabular-nums; }
    button.chip.on { color: #f7fbff; }
    button.chip.on .knob { background: rgba(62, 200, 234, 0.85); }
    button.chip.on .knob::after { transform: translateX(16px); background: #06202c; }
    button.chip.on em { color: #b7e9f6; }
    #detail {
      right: 176px; top: 16px; bottom: auto; width: 300px;
      padding: 0 0 10px; border: 1px solid var(--line); border-radius: 4px;
      background: rgba(8, 22, 36, 0.95); backdrop-filter: blur(8px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.38);
      opacity: 0; transform: translateX(10px); pointer-events: none;
      transition: opacity 0.28s ease, transform 0.28s ease;
    }
    #detail.open { opacity: 1; transform: none; pointer-events: auto; }
    .detail-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 8px 10px; border-bottom: 1px solid var(--line); background: rgba(62, 200, 234, 0.08);
    }
    #detail h2 { margin: 0; font-size: 14px; font-weight: 650; color: var(--cyan); letter-spacing: 0.04em; }
    #detail-close {
      width: 28px; height: 28px; cursor: pointer; border: 1px solid var(--line); border-radius: 3px;
      background: transparent; color: var(--cyan); font-size: 18px; line-height: 1;
    }
    #detail-close:hover { background: rgba(62, 200, 234, 0.16); }
    #rows { padding: 4px 12px 0; }
    #measure {
      right: 176px; bottom: 88px; width: 300px;
      padding: 12px; border: 1px solid var(--line); border-radius: 4px;
      background: rgba(8, 22, 36, 0.95); backdrop-filter: blur(8px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.38);
    }
    #measure[hidden] { display: none; }
    #measure h2 { margin: 0 0 4px; font-size: 14px; font-weight: 650; color: var(--cyan); letter-spacing: 0.04em; }
    #measure .hint { margin: 0 0 8px; color: var(--muted); font-size: 12px; }
    .measure-actions { display: flex; gap: 8px; margin-top: 8px; }
    .measure-actions button {
      flex: 1; cursor: pointer; letter-spacing: 0.06em; text-transform: uppercase; font-size: 12px;
      border: 1px solid var(--amber); background: transparent;
      color: var(--amber); border-radius: 3px; padding: 8px 6px;
      transition: background 0.18s ease, transform 0.18s ease;
    }
    .measure-actions button:hover { background: rgba(224, 177, 90, 0.16); transform: translateY(-1px); }
    #dim-layer { position: fixed; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
    .dim-label {
      position: absolute; transform: translate(-50%, -50%);
      padding: 0 4px; border-radius: 1px;
      background: #102033; border: 0;
      color: #f7fbff; font-size: 13px; font-weight: 650; line-height: 1.35;
      letter-spacing: 0.01em; font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    #snap {
      position: fixed; z-index: 4; width: 34px; height: 34px; margin: -17px 0 0 -17px;
      pointer-events: none;
    }
    #snap[hidden] { display: none; }
    #snap::before, #snap::after {
      content: ""; position: absolute; background: #9fb4c6;
    }
    #snap::before { left: 15px; top: 0; width: 4px; height: 34px; }
    #snap::after { top: 15px; left: 0; height: 4px; width: 34px; }
    #snap.locked::before, #snap.locked::after { background: #ffc857; }
    #snap b {
      position: absolute; left: 40px; top: 4px;
      background: #102033; color: #f7fbff; padding: 2px 7px; border-radius: 2px;
      font-size: 13px; font-weight: 650; white-space: nowrap;
    }
    .row { display: flex; gap: 12px; padding: 5px 0; border-top: 1px solid var(--line); }
    .row b { width: 84px; flex: none; color: var(--muted); font-weight: 550; }
    #only {
      margin: 10px 12px 0; width: calc(100% - 24px); cursor: pointer;
      border: 1px solid var(--amber); background: transparent;
      color: var(--amber); border-radius: 3px; padding: 8px 10px;
      letter-spacing: 0.08em; text-transform: uppercase; font-size: 12px;
      transition: background 0.18s ease, transform 0.18s ease;
    }
    #only:hover { background: rgba(224, 177, 90, 0.16); transform: translateY(-1px); }
    footer {
      left: 50%; bottom: 16px; transform: translateX(-50%);
      width: min(520px, calc(100vw - 560px));
      padding: 10px 14px 12px; border: 1px solid var(--line); border-radius: 4px;
      background: var(--glass); backdrop-filter: blur(8px);
    }
    footer p { margin: 0 0 8px; color: var(--muted); font-size: 12px; text-align: center; }
    footer label { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; letter-spacing: 0.08em; }
    input[type="range"] { flex: 1; accent-color: var(--amber); }
    @media (prefers-reduced-motion: reduce) {
      #detail { transition: none; }
    }
    @media (max-width: 800px) {
      #views, #tools { flex-direction: row; top: auto; bottom: 92px; width: auto; }
      #views { left: 8px; }
      #tools { right: 8px; }
      button.nav, button.tool { width: auto; padding: 6px 8px; }
      #filters { top: auto; bottom: 148px; max-height: 34vh; width: min(280px, calc(100vw - 16px)); }
      footer { width: calc(100vw - 24px); }
      #detail, #measure { left: 12px; right: 12px; top: auto; width: auto; }
      #detail { bottom: 210px; }
      #measure { bottom: 210px; max-height: 32vh; overflow: auto; }
    }
  </style>
</head>
<body>
  <header>
    <p class="kicker">QL1A · TC1-N5</p>
    <h1>Tuyến QL1A</h1>
    <p id="status">Đang tải mô hình…</p>
  </header>
  <nav id="views" aria-label="Góc nhìn">
    <button class="nav" type="button" data-view="orbit" aria-pressed="true">Toàn cảnh</button>
    <button class="nav" type="button" data-view="front">Mặt đứng</button>
    <button class="nav" type="button" data-view="side">Dọc tuyến</button>
    <button class="nav" type="button" data-view="top">Mặt bằng</button>
  </nav>
  <nav id="tools" aria-label="Công cụ">
    <button class="tool" id="layers-toggle" type="button" aria-pressed="true">Lớp</button>
    <button class="tool" id="explode-toggle" type="button" aria-pressed="false" title="Nhấc móng, mặt cầu, cột, lan can và từng hồ sơ">Tách lớp</button>
    <button class="tool" id="measure-toggle" type="button" aria-pressed="false">Đo</button>
  </nav>
  <aside id="filters">
    <p class="hint">Gạt để hiện hoặc ẩn</p>
    <h2>MÔ HÌNH</h2>
    <div class="chips" id="models"></div>
    <h2>TẦNG</h2>
    <div class="chips" id="storeys"></div>
    <h2>LOẠI</h2>
    <div class="chips" id="kinds"></div>
  </aside>
  <aside id="detail">
    <div class="detail-head">
      <h2 id="detail-title">Cấu kiện</h2>
      <button id="detail-close" type="button" aria-label="Đóng">×</button>
    </div>
    <div id="rows"></div>
    <button id="only" type="button">Chỉ hiện cấu kiện này</button>
  </aside>
  <aside id="measure" hidden>
    <h2>Đo</h2>
    <p id="measure-hint" class="hint">Bấm điểm đầu, điểm cuối, rồi bấm chỗ đặt đường kích thước. Giữ Shift để khóa vuông góc.</p>
    <div id="measure-rows"></div>
    <div class="measure-actions">
      <button id="measure-break" type="button">Ngắt chuỗi</button>
      <button id="measure-clear" type="button">Xóa kích thước</button>
    </div>
  </aside>
  <div id="dim-layer"></div>
  <div id="snap" hidden><b id="snap-text"></b></div>
  <footer>
    <p id="hint">Kéo để xoay · cuộn để phóng · bấm một cấu kiện</p>
    <label>TÁCH
      <input id="explode" type="range" min="0" max="12" step="0.1" value="0" aria-label="Mức tách lớp">
    </label>
  </footer>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

    const STOREY_ORDER = ["ĐÁY ĐÀI", "MẶT ĐÀI", "MDTN", "TẦNG 1", "TẦNG 2", "TẦNG 3", "TẦNG 4", "TẦNG TUM", "TẦNG MÁI"];
    const KIND_ORDER = ["Kết cấu mặt", "Địa hình", "Lan can", "Cột", "Dầm", "Tường", "Đèn", "Thiết bị", "Cấu kiện", "Móng", "Cọc", "Tấm"];
    const KIND_HEX = {
  "Kết cấu mặt": "#b8883e",
  "Địa hình": "#6e4c30",
      "Lan can": "#9aa6b0",
      "Cột": "#a7a59b",
      "Dầm": "#b5a48a",
      "Tường": "#9c907f",
      "Đèn": "#e0b15a",
      "Thiết bị": "#c9843c",
      "Cấu kiện": "#8d9aa4",
      "Cây": "#5f8f4e",
      "Móng": "#6e5e4e",
      "Cọc": "#5c5348",
      "Tấm": "#b7aa96",
    };
    const LAYER_HEX = {
      Tuyen: "#d7b072",
      Cau: "#cbb892",
      Cong: "#a89878",
      ChieuSang: "#e6c36a",
      ATGT: "#d4893a",
      CanhQuan: "#6e9a58",
      HienTrang: "#8d7d68",
    };
    const MODEL_ORDER = ["Tuyen", "Cau", "Cong", "ChieuSang", "ATGT", "CanhQuan", "HienTrang"];
    const MODEL_LABEL = {
      Tuyen: "Tuyến",
      Cau: "Cầu",
      Cong: "Cống ngang",
      ChieuSang: "Chiếu sáng",
      ATGT: "An toàn giao thông",
      CanhQuan: "Cảnh quan",
      HienTrang: "Hiện trạng",
    };
    const MODEL_FILES = [
      ["Tuyen", "Tuyen.glb"],
      ["Cau", "Cau.glb"],
      ["Cong", "Cong.glb"],
      ["ChieuSang", "ChieuSang.glb"],
      ["ATGT", "ATGT.glb"],
      ["CanhQuan", "CanhQuan.glb"],
      ["HienTrang", "HienTrang.glb"],
    ];
    const TINT = {
      base: new THREE.Color(1, 1, 1),
      hot: new THREE.Color(1.22, 1.12, 0.92),
      cool: new THREE.Color(0.82, 1.06, 1.18),
    };
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const SURVEY_X = 593640;
    const SURVEY_Y = 2080960;

    const status = document.getElementById("status");
    const rows = document.getElementById("rows");
    const detail = document.getElementById("detail");
    const detailTitle = document.getElementById("detail-title");
    const onlyButton = document.getElementById("only");
    const explode = document.getElementById("explode");
    const explodeToggle = document.getElementById("explode-toggle");

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.92;
    document.body.prepend(renderer.domElement);

    const pmrem = new THREE.PMREMGenerator(renderer);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0c1c2e);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    pmrem.dispose();
    scene.add(new THREE.HemisphereLight(0xffe4bc, 0x1a2838, 0.22));
    const sun = new THREE.DirectionalLight(0xfff2df, 0.72);
    sun.position.set(48, 72, 26);
    scene.add(sun);

    const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.2, 12000);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = !reduceMotion;
    controls.dampingFactor = 0.08;
    controls.rotateSpeed = 0.72;
    controls.zoomSpeed = 0.85;
    controls.zoomToCursor = true;

    const grid = new THREE.Mesh(
      new THREE.PlaneGeometry(6000, 6000),
      new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        uniforms: {
          uColor: { value: new THREE.Color(0x49d4f0) },
          uOrigin: { value: new THREE.Vector2(30, -16) },
        },
        vertexShader: `
          varying vec3 vPos;
          void main() {
            vec4 world = modelMatrix * vec4(position, 1.0);
            vPos = world.xyz;
            gl_Position = projectionMatrix * viewMatrix * world;
          }
        `,
        fragmentShader: `
          varying vec3 vPos;
          uniform vec3 uColor;
          uniform vec2 uOrigin;
          float lines(vec2 coord) {
            vec2 grid = abs(fract(coord - 0.5) - 0.5) / fwidth(coord);
            return 1.0 - min(min(grid.x, grid.y), 1.0);
          }
          void main() {
            float minor = lines(vPos.xz);
            float mid = lines(vPos.xz / 10.0);
            float major = lines(vPos.xz / 100.0);
            float fade = 1.0 - smoothstep(400.0, 2800.0, distance(vPos.xz, uOrigin));
            float alpha = max(max(minor * 0.16, mid * 0.34), major * 0.6) * fade;
            gl_FragColor = vec4(uColor, alpha);
          }
        `,
      })
    );
    grid.rotation.x = -Math.PI / 2;
    grid.renderOrder = -1;
    scene.add(grid);

    const building = new THREE.Group();
    building.rotation.x = -Math.PI / 2;
    scene.add(building);

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const items = [];
    const lookup = new Map();
    const batches = [];
    const modelOn = new Set();
    const storeyOn = new Set();
    const kindOn = new Set();
    let meta = {};
    let selectedGuid = null;
    let hoverGuid = null;
    let isolatedGuid = null;
    let targetGap = 0;
    let gap = 0;
    let home = null;
    let flying = null;
    let dragging = false;

    const LAYER_LIFT = 90;
    const PART_LIFT = 8;

    function layerRank(modelId) {
      const index = MODEL_ORDER.indexOf(modelId);
      return index < 0 ? 0 : index;
    }

    function colorOf(modelId, kind, storey) {
      const color = new THREE.Color(KIND_HEX[kind] || "#7d8b98");
      const layer = new THREE.Color(LAYER_HEX[modelId] || "#ffffff");
      color.lerp(layer, 0.22);
      if ((storey || "").startsWith("00-")) color.multiplyScalar(0.62);
      return color;
    }

    function partRank(storey, kind) {
      const level = storey || "";
      if (level.startsWith("00-")) return 0;
      const order = {
        "Kết cấu mặt": 1,
        "Địa hình": 1,
        "Cột": 2,
        "Dầm": 2,
        "Tường": 2,
        "Cọc": 2,
        "Móng": 2,
        "Tấm": 2,
        "Lan can": 3,
        "Đèn": 4,
        "Thiết bị": 4,
        "Cây": 4,
      };
      let rank = Object.prototype.hasOwnProperty.call(order, kind) ? order[kind] : 5;
      if (level.startsWith("02-")) rank += 1;
      if (level.startsWith("03-")) rank += 2;
      if (level.startsWith("04-")) rank += 3;
      return rank;
    }

    function stackOffset(rank, part, amount) {
      return (rank * LAYER_LIFT + part * PART_LIFT) * amount;
    }

    function storeyLabel(name) {
      if (name === "MDTN") return "Mặt đất";
      const lower = name.toLowerCase();
      return lower.charAt(0).toUpperCase() + lower.slice(1);
    }

    function ease(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function flyToBox(box) {
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const radius = Math.max(size.x, size.y, size.z) * 0.62;
      const distance = radius / Math.sin((camera.fov * Math.PI) / 360);
      const offset = new THREE.Vector3(distance * 0.86, distance * 0.52, distance * 0.78);
      flyTo(center.clone().add(offset), center);
      camera.near = Math.max(0.05, radius / 4000);
      camera.far = Math.max(4000, radius * 40);
      camera.updateProjectionMatrix();
    }

    function flyTo(position, target) {
      if (reduceMotion) {
        camera.position.copy(position);
        controls.target.copy(target);
        flying = null;
        return;
      }
      flying = {
        from: camera.position.clone(),
        to: position.clone(),
        fromTarget: controls.target.clone(),
        toTarget: target.clone(),
        t: 0,
      };
    }

    function viewOffset(name, box) {
      const size = box.getSize(new THREE.Vector3());
      const reach = Math.max(size.x, size.y, size.z);
      const distance = reach / Math.sin((camera.fov * Math.PI) / 360);
      if (name === "front") return new THREE.Vector3(0, size.y * 0.15, distance * 0.92);
      if (name === "side") return new THREE.Vector3(distance * 1.05, size.y * 0.2, 0);
      if (name === "top") return new THREE.Vector3(0, distance * 1.15, distance * 0.04);
      return new THREE.Vector3(distance * 0.78, distance * 0.48, distance * 0.72);
    }

    function showView(name) {
      const box = visibleBox(targetGap) || home;
      if (!box) return;
      const center = box.getCenter(new THREE.Vector3());
      flyTo(center.clone().add(viewOffset(name, box)), center);
      for (const button of document.querySelectorAll("#views button")) {
        button.setAttribute("aria-pressed", button.dataset.view === name ? "true" : "false");
      }
    }

    function format(value, unit) {
      if (value == null) return null;
      return new Intl.NumberFormat("vi-VN", { maximumFractionDigits: 2 }).format(value) + " " + unit;
    }

    function formatMeters(value) {
      return new Intl.NumberFormat("vi-VN", { minimumFractionDigits: 3, maximumFractionDigits: 3 }).format(value) + " m";
    }

    function formatLength(value) {
      const mm = new Intl.NumberFormat("vi-VN", { maximumFractionDigits: 0, useGrouping: false }).format(Math.round(Math.abs(value) * 1000));
      const sign = value < 0 ? "−" : "";
      return formatMeters(value) + " (" + sign + mm + " mm)";
    }

    function elementBox(key) {
      const box = new THREE.Box3();
      let any = false;
      for (const item of items) {
        if (item.key !== key) continue;
        box.union(item.worldBox);
        any = true;
      }
      return any ? box : null;
    }

    function addRow(label, value) {
      if (!value) return;
      const row = document.createElement("div");
      row.className = "row";
      const name = document.createElement("b");
      name.textContent = label;
      row.append(name, document.createTextNode(value));
      rows.append(row);

    function clearSelection() {
      selectedGuid = null;
      detail.classList.remove("open");
    }

    function applyTint() {
      for (const item of items) {
        const next = item.key === selectedGuid ? "hot" : item.key === hoverGuid ? "cool" : "base";
        if (item.tint === next) continue;
        item.tint = next;
        item.batch.setColorAt(item.instanceId, TINT[next]);
      }
    }

    function applyVisibility() {
      for (const item of items) {
        const info = meta[item.key] || {};
        const storey = info.storey || "Khác";
        const kind = info.classLabel || item.kind;
        item.visible = modelOn.has(item.model) && (!isolatedGuid || item.key === isolatedGuid) && storeyOn.has(storey) && kindOn.has(kind);
        item.batch.setVisibleAt(item.instanceId, item.visible);
        if (item.edges) item.edges.visible = item.visible;
      }
    }

    function applyGap(next) {
      const lift = new THREE.Matrix4();
      const placed = new THREE.Matrix4();
      for (const item of items) {
        lift.makeTranslation(0, 0, stackOffset(item.rank, item.part, next));
        placed.multiplyMatrices(lift, item.placement);
        item.batch.setMatrixAt(item.instanceId, placed);
        if (item.edges) item.edges.matrix.copy(placed);
      }
      for (const batch of batches) {
        batch.computeBoundingBox();
        batch.computeBoundingSphere();
      }
    }

    function visibleBox(nextGap) {
      const box = new THREE.Box3();
      let any = false;
      for (const item of items) {
        if (!item.visible) continue;
        const shifted = item.worldBox.clone();
        shifted.min.y += stackOffset(item.rank, item.part, nextGap);
        shifted.max.y += stackOffset(item.rank, item.part, nextGap);
        if (shifted.max.y < -3) continue;
        box.union(shifted);
        any = true;
      }
      if (any) return box;
      return home || new THREE.Box3(new THREE.Vector3(-10, -1, -10), new THREE.Vector3(10, 4, 10));
    }

    function raycast(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(batches, false);
      for (const hit of hits) {
        if (hit.batchId == null || hit.batchId < 0) continue;
        const item = lookup.get(hit.object.uuid + ":" + hit.batchId);
        if (item && item.visible) return { item, point: hit.point.clone() };
      }
      return null;
    }

    function chips(parent, names, active, labelOf, keyOf, initiallyOn, swatchOf) {
      parent.replaceChildren();
      for (const name of names) {
        const button = document.createElement("button");
        button.type = "button";
        const startsOn = initiallyOn ? initiallyOn(name) : true;
        button.className = startsOn ? "chip on" : "chip";
        button.setAttribute("aria-pressed", startsOn ? "true" : "false");
        const knob = document.createElement("span");
        knob.className = "knob";
        knob.setAttribute("aria-hidden", "true");
        const label = document.createElement("span");
        label.textContent = labelOf(name);
        button.append(knob);
        if (swatchOf) {
          const swatch = document.createElement("i");
          swatch.className = "swatch";
          swatch.style.background = swatchOf(name);
          button.append(swatch);
        }
        button.append(label);
        const count = document.createElement("em");
        const ids = new Set(items.filter((item) => keyOf(item) === name).map((item) => item.key));
        count.textContent = String(ids.size);
        button.append(count);
        if (startsOn) active.add(name);
        button.addEventListener("click", () => {
          if (active.has(name)) active.delete(name);
          else active.add(name);
          const on = active.has(name);
          button.classList.toggle("on", on);
          button.setAttribute("aria-pressed", on ? "true" : "false");
          isolatedGuid = null;
          applyVisibility();
          applyTint();
        });
        parent.append(button);
      }
    }

    function packGeometry(geometry) {
      const packed = new THREE.BufferGeometry();
      const position = geometry.getAttribute("position");
      packed.setAttribute("position", position.clone());
      let normal = geometry.getAttribute("normal");
      if (!normal) {
        const temp = geometry.clone();
        temp.computeVertexNormals();
        normal = temp.getAttribute("normal");
      }
      packed.setAttribute("normal", normal.clone());
      if (geometry.index) {
        packed.setIndex(geometry.index.clone());
      } else {
        const count = position.count;
        const array = count > 65535 ? new Uint32Array(count) : new Uint16Array(count);
        for (let index = 0; index < count; index += 1) array[index] = index;
        packed.setIndex(new THREE.BufferAttribute(array, 1));
      }
      packed.computeBoundingBox();
      return packed;
    }

    function buildBatches(meshes) {
      const groups = new Map();
      for (const mesh of meshes) {
        const source = Array.isArray(mesh.material) ? mesh.material[0] : mesh.material;
        const named = mesh.userData.name || mesh.name;
        const nameParts = named.split(":");
        const modelId = mesh.userData.modelId;
        const info = meta[modelId + ":" + (nameParts[1] || "")] || {};
        const kind = info.classLabel || nameParts[0].replace(/^Ifc/, "");
        const color = colorOf(modelId, kind, info.storey);
        const opacity = source && source.opacity != null ? source.opacity : 1;
        const key = color.getHexString() + "|" + opacity.toFixed(3);
        if (!groups.has(key)) {
          groups.set(key, {
            color,
            opacity,
            meshes: [],
            vertices: 0,
            indices: 0,
          });
        }
        const group = groups.get(key);
        const position = mesh.geometry.getAttribute("position");
        const index = mesh.geometry.index;
        group.meshes.push(mesh);
        if (!group.seen) group.seen = new Set();
        if (group.seen.has(mesh.geometry.uuid)) continue;
        group.seen.add(mesh.geometry.uuid);
        group.vertices += position.count;
        group.indices += index ? index.count : position.count;
      }

      const yUp = new THREE.Matrix4().makeRotationX(-Math.PI / 2);
      const edgeMaterial = new THREE.LineBasicMaterial({
        color: 0x49d7f2,
        transparent: true,
        opacity: 0.72,
        depthTest: true,
        polygonOffset: true,
        polygonOffsetFactor: -2,
        polygonOffsetUnits: -2,
      });
      let edgeBudget = 900;
      for (const group of groups.values()) {
        const material = new THREE.MeshStandardMaterial({
          color: group.color,
          roughness: 0.92,
          metalness: 0,
          opacity: group.opacity,
          transparent: group.opacity < 0.999,
          side: THREE.DoubleSide,
          envMapIntensity: 0.08,
        });
        const batch = new THREE.BatchedMesh(group.meshes.length, group.vertices + 8, group.indices + 24, material);
        batch.frustumCulled = true;
        if (material.transparent) batch.renderOrder = 2;
        building.add(batch);
        batches.push(batch);
        const shared = new Map();
        for (const mesh of group.meshes) {
          const source = mesh.userData.name || mesh.name;
          const parts = source.split(":");
          const guid = parts[1] || "";
          const modelId = mesh.userData.modelId;
          const key = modelId + ":" + guid;
          const info = meta[key] || {};
          let record = shared.get(mesh.geometry.uuid);
          if (!record) {
            const packed = packGeometry(mesh.geometry);
            const srcPos = packed.getAttribute("position");
            const positions = new Float32Array(srcPos.count * 3);
            for (let index = 0; index < srcPos.count; index += 1) {
              positions[index * 3] = srcPos.getX(index);
              positions[index * 3 + 1] = srcPos.getY(index);
              positions[index * 3 + 2] = srcPos.getZ(index);
            }
            record = {
              geometryId: batch.addGeometry(packed),
              positions,
              box: packed.boundingBox.clone(),
              edges: srcPos.count >= 12 && srcPos.count <= 1600 ? new THREE.EdgesGeometry(packed, 28) : null,
            };
            shared.set(mesh.geometry.uuid, record);
            packed.dispose();
          }
          const instanceId = batch.addInstance(record.geometryId);
          const placement = mesh.matrixWorld.clone();
          batch.setMatrixAt(instanceId, placement);
          batch.setColorAt(instanceId, TINT.base);
          let edges = null;
          if (record.edges && edgeBudget > 0) {
            edges = new THREE.LineSegments(record.edges, edgeMaterial);
            edges.matrix.copy(placement);
            edges.matrixAutoUpdate = false;
            edges.frustumCulled = false;
            building.add(edges);
            edgeBudget -= 1;
          }
          const worldBox = record.box.clone().applyMatrix4(placement).applyMatrix4(yUp);
          const item = {
            batch,
            instanceId,
            guid,
            key,
            model: modelId,
            kind: info.classLabel || parts[0].replace(/^Ifc/, ""),
            rank: layerRank(modelId),
            part: partRank(info.storey, info.classLabel || parts[0].replace(/^Ifc/, "")),
            placement,
            edges,
            worldBox,
            positions: record.positions,
            visible: true,
            tint: "base",
          };
          items.push(item);
          lookup.set(batch.uuid + ":" + instanceId, item);
        }
        batch.computeBoundingBox();
        batch.computeBoundingSphere();
      }
    }

    const measurePanel = document.getElementById("measure");
    const measureRows = document.getElementById("measure-rows");
    const measureHint = document.getElementById("measure-hint");
    const snapEl = document.getElementById("snap");
    const snapText = document.getElementById("snap-text");
    const measureToggle = document.getElementById("measure-toggle");
    const hint = document.getElementById("hint");
    const dimLayer = document.getElementById("dim-layer");
    const markerGeometry = new THREE.SphereGeometry(1, 14, 10);
    const barGeometry = new THREE.CylinderGeometry(1, 1, 1, 7);
    const barUp = new THREE.Vector3(0, 1, 0);
    const barDirection = new THREE.Vector3();
    const snapLocal = new THREE.Vector3();
    const snapWorld = new THREE.Vector3();
    const snapNdc = new THREE.Vector3();
    const instanceMatrix = new THREE.Matrix4();
    const fullMatrix = new THREE.Matrix4();
    const inverseMatrix = new THREE.Matrix4();
    let measuring = false;
    let breakChain = false;
    let previewSample = null;
    let dimDraft = null;
    let placeCursor = null;
    let snapLocked = false;
    let panelKey = "";
    const chain = [];
    const spots = [];
    const dims = [];
    const previewMarker = makeMarker(true);
    previewMarker.visible = false;
    const previewDim = makeDimension();

    function makeMarker(snapped) {
      const material = new THREE.MeshBasicMaterial({
        color: snapped ? 0xffc857 : 0xd7e7f6,
        depthTest: false,
        depthWrite: false,
        toneMapped: false,
      });
      const mesh = new THREE.Mesh(markerGeometry, material);
      mesh.renderOrder = 12;
      mesh.frustumCulled = false;
      mesh.visible = false;
      scene.add(mesh);
      return mesh;
    }

    function makeBar(opacity) {
      const group = new THREE.Group();
      const outline = new THREE.Mesh(barGeometry, new THREE.MeshBasicMaterial({
        color: 0x071422,
        depthTest: false,
        depthWrite: false,
        toneMapped: false,
        transparent: opacity < 1,
        opacity,
      }));
      const core = new THREE.Mesh(barGeometry, new THREE.MeshBasicMaterial({
        color: 0xf5f8fb,
        depthTest: false,
        depthWrite: false,
        toneMapped: false,
        transparent: opacity < 1,
        opacity,
      }));
      outline.renderOrder = 11;
      core.renderOrder = 12;
      outline.frustumCulled = false;
      core.frustumCulled = false;
      group.add(outline, core);
      group.frustumCulled = false;
      group.visible = false;
      scene.add(group);
      return group;
    }

    function makeLabel() {
      const label = document.createElement("div");
      label.className = "dim-label";
      label.style.display = "none";
      dimLayer.append(label);
      return label;
    }

    function fitMarker(mesh, world) {
      const distance = Math.max(camera.position.distanceTo(world), 0.4);
      mesh.position.copy(world);
      mesh.scale.setScalar(pixelsAt(distance, 3.2));
      mesh.visible = true;
    }

    function pixelsAt(distance, count) {
      return 2 * Math.tan((camera.fov * Math.PI) / 360) * distance / innerHeight * count;
    }

    function makeDimension() {
      return {
        strokes: Array.from({ length: 10 }, () => makeBar(1)),
        lengthLabel: makeLabel(),
        heightLabel: makeLabel(),
      };
    }

    function hideDimension(dim) {
      for (const stroke of dim.strokes) stroke.visible = false;
      dim.lengthLabel.style.display = "none";
      dim.heightLabel.style.display = "none";
    }

    function placeLabel(label, world, text) {
      label.textContent = text;
      const ndc = world.clone().project(camera);
      if (ndc.z < -1 || ndc.z > 1) {
        label.style.display = "none";
        return;
      }
      label.style.display = "block";
      label.style.left = ((ndc.x * 0.5 + 0.5) * innerWidth) + "px";
      label.style.top = ((-ndc.y * 0.5 + 0.5) * innerHeight) + "px";
    }

    function setBar(mesh, from, to, weight) {
      barDirection.subVectors(to, from);
      const length = barDirection.length();
      if (length < 0.001) {
        mesh.visible = false;
        return;
      }
      const distance = Math.max(camera.position.distanceTo(from), 0.5);
      const worldPerPixel = 2 * Math.tan((camera.fov * Math.PI) / 360) * distance / innerHeight;
      const thickness = worldPerPixel * (weight || 2.2);
      const direction = barDirection.multiplyScalar(1 / length);
      mesh.position.copy(from).lerp(to, 0.5);
      mesh.quaternion.setFromUnitVectors(barUp, direction);
      mesh.children[0].scale.set(thickness * 2.1, length, thickness * 2.1);
      mesh.children[1].scale.set(thickness, length, thickness);
      mesh.visible = true;
    }

    function realLocalToWorld(local, rank, part, target) {
      target.copy(local);
      target.z += stackOffset(rank, part, gap);
      return building.localToWorld(target);
    }

    function sampleFromWorld(worldPoint, item) {
      const local = building.worldToLocal(worldPoint.clone());
      local.z -= stackOffset(item.rank, item.part, gap);
      return {
        local,
        rank: item.rank,
        part: item.part,
        survey: {
          x: local.x + SURVEY_X,
          y: local.y + SURVEY_Y,
          z: local.z,
        },
      };
    }

    function snapWorldPoint(hitPoint, item, clientX, clientY) {
      const positions = item.positions;
      const rect = renderer.domElement.getBoundingClientRect();
      const cursorX = clientX - rect.left;
      const cursorY = clientY - rect.top;
      item.batch.getMatrixAt(item.instanceId, instanceMatrix);
      building.updateMatrixWorld(true);
      fullMatrix.multiplyMatrices(building.matrixWorld, instanceMatrix);
      inverseMatrix.copy(fullMatrix).invert();
      snapLocal.copy(hitPoint).applyMatrix4(inverseMatrix);
      const hitDistance = Math.max(camera.position.distanceTo(hitPoint), 0.4);
      const reach = pixelsAt(hitDistance, 170);
      const reachSq = reach * reach;
      let best = null;
      let bestPixels = 110 * 110;
      for (let index = 0; index < positions.length; index += 3) {
        const dx = positions[index] - snapLocal.x;
        const dy = positions[index + 1] - snapLocal.y;
        const dz = positions[index + 2] - snapLocal.z;
        if (dx * dx + dy * dy + dz * dz > reachSq) continue;
        snapWorld.set(positions[index], positions[index + 1], positions[index + 2]).applyMatrix4(fullMatrix);
        if (Math.abs(snapWorld.distanceTo(camera.position) - hitDistance) > reach) continue;
        snapNdc.copy(snapWorld).project(camera);
        if (snapNdc.z < -1 || snapNdc.z > 1) continue;
        const sx = (snapNdc.x * 0.5 + 0.5) * rect.width;
        const sy = (-snapNdc.y * 0.5 + 0.5) * rect.height;
        const pixels = (sx - cursorX) * (sx - cursorX) + (sy - cursorY) * (sy - cursorY);
        if (pixels < bestPixels) {
          bestPixels = pixels;
          best = snapWorld.clone();
        }
      }
      return best ? { point: best, snapped: true } : { point: hitPoint.clone(), snapped: false };
    }

    function segmentNumbers(a, b) {
      const dx = b.survey.x - a.survey.x;
      const dy = b.survey.y - a.survey.y;
      const dz = b.survey.z - a.survey.z;
      const plan = Math.hypot(dx, dy);
      const space = Math.hypot(plan, dz);
      return { dx, dy, dz, plan, space };
    }

    function screenSide(direction, origin, prefer) {
      const viewDir = camera.getWorldDirection(new THREE.Vector3());
      const side = new THREE.Vector3().crossVectors(direction, viewDir);
      if (side.lengthSq() < 1e-8) side.crossVectors(direction, new THREE.Vector3(0, 1, 0));
      if (side.lengthSq() < 1e-8) side.set(1, 0, 0);
      side.normalize();
      const originNdc = origin.clone().project(camera);
      const aheadNdc = origin.clone().add(side).project(camera);
      const upward = aheadNdc.y - originNdc.y;
      const rightward = aheadNdc.x - originNdc.x;
      if (prefer === "up" && upward < 0) side.negate();
      if (prefer === "right" && rightward < 0) side.negate();
      return side;
    }

    function placementOf(from, to, cursor) {
      const direction = to.clone().sub(from);
      if (direction.lengthSq() < 1e-6) return null;
      direction.normalize();
      const mid = from.clone().lerp(to, 0.5);
      const side = screenSide(direction, mid, "up");
      const signed = cursor.clone().sub(mid).dot(side);
      if (signed < 0) side.negate();
      const distance = Math.max(camera.position.distanceTo(mid), 0.5);
      return { side, distance: Math.max(Math.abs(signed), pixelsAt(distance, 18)) };
    }

    function pointOnViewPlane(event, anchor) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const normal = camera.getWorldDirection(new THREE.Vector3());
      const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(normal, anchor);
      const hit = new THREE.Vector3();
      return raycaster.ray.intersectPlane(plane, hit) ? hit : anchor.clone();
    }

    function orthoPoint(origin, point) {
      const next = point.clone();
      const dx = Math.abs(point.x - origin.x);
      const dy = Math.abs(point.y - origin.y);
      const dz = Math.abs(point.z - origin.z);
      if (dy >= dx && dy >= dz) {
        next.x = origin.x;
        next.z = origin.z;
      } else if (dx >= dz) {
        next.y = origin.y;
        next.z = origin.z;
      } else {
        next.x = origin.x;
        next.y = origin.y;
      }
      return next;
    }

    function layoutAligned(from, to, placed) {
      const direction = to.clone().sub(from);
      const length = direction.length();
      if (length < 0.001) return null;
      direction.multiplyScalar(1 / length);
      const mid = from.clone().lerp(to, 0.5);
      const distance = Math.max(camera.position.distanceTo(mid), 0.5);
      const side = placed ? placed.side.clone() : screenSide(direction, mid, "up");
      const gap = pixelsAt(distance, 8);
      const offset = placed ? placed.distance : pixelsAt(distance, 36);
      const overrun = pixelsAt(distance, 10);
      const tick = pixelsAt(distance, 12);
      const dimFrom = from.clone().addScaledVector(side, offset);
      const dimTo = to.clone().addScaledVector(side, offset);
      const tickDir = direction.clone().add(side).normalize();
      return {
        segments: [
          [from.clone().addScaledVector(side, gap), from.clone().addScaledVector(side, offset + overrun), 1.7],
          [to.clone().addScaledVector(side, gap), to.clone().addScaledVector(side, offset + overrun), 1.7],
          [dimFrom, dimTo, 2.2],
          [dimFrom.clone().addScaledVector(tickDir, -tick), dimFrom.clone().addScaledVector(tickDir, tick), 4.4],
          [dimTo.clone().addScaledVector(tickDir, -tick), dimTo.clone().addScaledVector(tickDir, tick), 4.4],
        ],
        textAt: dimFrom.clone().lerp(dimTo, 0.5).addScaledVector(side, pixelsAt(distance, 13)),
      };
    }

    function layoutHeight(from, to) {
      const rise = Math.abs(to.y - from.y);
      const plan = Math.hypot(to.x - from.x, to.z - from.z);
      if (rise < 0.05 || plan < 0.05) return null;
      const mid = from.clone().lerp(to, 0.5);
      const distance = Math.max(camera.position.distanceTo(mid), 0.5);
      const side = screenSide(new THREE.Vector3(0, 1, 0), mid, "right");
      const gap = pixelsAt(distance, 8);
      const offset = pixelsAt(distance, 48);
      const overrun = pixelsAt(distance, 10);
      const tick = pixelsAt(distance, 12);
      const y0 = Math.min(from.y, to.y);
      const y1 = Math.max(from.y, to.y);
      const dimBottom = new THREE.Vector3(mid.x, y0, mid.z).addScaledVector(side, offset);
      const dimTop = new THREE.Vector3(mid.x, y1, mid.z).addScaledVector(side, offset);
      const low = from.y <= to.y ? from : to;
      const high = from.y <= to.y ? to : from;
      const witness = (point, end) => {
        const span = end.clone().sub(point);
        const spanLength = span.length();
        if (spanLength < gap + pixelsAt(distance, 4)) return [point.clone(), end.clone()];
        span.multiplyScalar(1 / spanLength);
        return [point.clone().addScaledVector(span, gap), end.clone().addScaledVector(span, overrun)];
      };
      const lowWitness = witness(low, dimBottom);
      const highWitness = witness(high, dimTop);
      const tickDir = side.clone().add(new THREE.Vector3(0, 1, 0)).normalize();
      return {
        segments: [
          [...lowWitness, 1.7],
          [...highWitness, 1.7],
          [dimBottom, dimTop, 2.2],
          [dimBottom.clone().addScaledVector(tickDir, -tick), dimBottom.clone().addScaledVector(tickDir, tick), 4.4],
          [dimTop.clone().addScaledVector(tickDir, -tick), dimTop.clone().addScaledVector(tickDir, tick), 4.4],
        ],
        textAt: dimBottom.clone().lerp(dimTop, 0.5).addScaledVector(side, pixelsAt(distance, 14)),
      };
    }

    function paintDimension(dim, from, to, placed) {
      const aligned = layoutAligned(from, to, placed);
      if (!aligned) {
        hideDimension(dim);
        return;
      }
      const height = layoutHeight(from, to);
      const segments = aligned.segments.concat(height ? height.segments : []);
      dim.strokes.forEach((stroke, index) => {
        const segment = segments[index];
        if (!segment) {
          stroke.visible = false;
          return;
        }
        setBar(stroke, segment[0], segment[1], segment[2]);
      });
      const length = from.distanceTo(to);
      placeLabel(dim.lengthLabel, aligned.textAt, formatMeters(length));
      if (height) placeLabel(dim.heightLabel, height.textAt, formatMeters(Math.abs(to.y - from.y)));
      else dim.heightLabel.style.display = "none";
    }

    function addMeasureRow(label, value) {
      const row = document.createElement("div");
      row.className = "row";
      const name = document.createElement("b");
      name.textContent = label;
      row.append(name, document.createTextNode(value));
      measureRows.append(row);
    }

    function fillMeasurePanel() {
      const last = !breakChain && chain.length ? chain[chain.length - 1] : null;
      const latest = dims.length ? dims[dims.length - 1] : null;
      const numbers = latest ? segmentNumbers(latest.a, latest.b) : null;
      const key = JSON.stringify({
        preview: previewSample && [previewSample.survey.x, previewSample.survey.y, previewSample.survey.z].map((value) => Math.round(value * 1000)),
        last: last && [last.survey.x, last.survey.y, last.survey.z].map((value) => Math.round(value * 1000)),
        numbers: numbers && [numbers.dx, numbers.dy, numbers.dz, numbers.plan, numbers.space].map((value) => Math.round(value * 1000)),
        count: dims.length,
        breakChain,
      });
      if (key === panelKey) return;
      panelKey = key;
      measureRows.replaceChildren();
      if (dimDraft) measureHint.textContent = "Bấm chỗ đặt đường kích thước, ra phía ngoài mô hình.";
      else if (chain.length === 1) measureHint.textContent = "Bấm điểm cuối. Giữ Shift để khóa ngang, dọc hoặc đứng.";
      else measureHint.textContent = "Bấm điểm đầu. Dấu cộng vàng là điểm cuối.";
      if (!previewSample && !last && !latest && !dimDraft) return;
      const shown = previewSample || last;
      if (shown) {
        addMeasureRow("X", formatMeters(shown.survey.x));
        addMeasureRow("Y", formatMeters(shown.survey.y));
        addMeasureRow("Z", formatMeters(shown.survey.z));
      }
      if (numbers) {
        addMeasureRow("Dài", formatLength(numbers.space));
        addMeasureRow("Mặt bằng", formatLength(numbers.plan));
        addMeasureRow("ΔX", formatLength(numbers.dx));
        addMeasureRow("ΔY", formatLength(numbers.dy));
        addMeasureRow("Cao", formatLength(numbers.dz));
      }
    }

    function updateMeasureGraphics() {
      const worldA = new THREE.Vector3();
      const worldB = new THREE.Vector3();
      const shoulder = new THREE.Vector3();
      const showSpot = !breakChain && chain.length === 1 && !(measuring && previewSample);
      for (const spot of spots) {
        realLocalToWorld(spot.sample.local, spot.sample.rank, spot.sample.part, worldA);
        fitMarker(spot.marker, worldA);
        const lone = showSpot && spot.sample === chain[0];
        if (!lone) {
          spot.leader.visible = false;
          spot.label.style.display = "none";
          continue;
        }
        shoulder.set(1, 0, 0).applyQuaternion(camera.quaternion);
        const reach = pixelsAt(Math.max(camera.position.distanceTo(worldA), 0.4), 26);
        shoulder.multiplyScalar(reach);
        setBar(spot.leader, worldA, worldB.copy(worldA).add(shoulder), 1.6);
        placeLabel(spot.label, worldB, formatMeters(spot.sample.survey.z));
      }
      for (const dim of dims) {
        realLocalToWorld(dim.a.local, dim.a.rank, dim.a.part, worldA);
        realLocalToWorld(dim.b.local, dim.b.rank, dim.b.part, worldB);
        paintDimension(dim.graphic, worldA, worldB, dim.side ? { side: dim.side, distance: dim.distance } : null);
      }
      if (measuring && dimDraft && placeCursor) {
        realLocalToWorld(dimDraft.a.local, dimDraft.a.rank, dimDraft.a.part, worldA);
        realLocalToWorld(dimDraft.b.local, dimDraft.b.rank, dimDraft.b.part, worldB);
        paintDimension(previewDim, worldA, worldB, placementOf(worldA, worldB, placeCursor));
        previewMarker.visible = false;
      } else if (measuring && previewSample) {
        realLocalToWorld(previewSample.local, previewSample.rank, previewSample.part, worldA);
        fitMarker(previewMarker, worldA);
        const anchor = !breakChain && chain.length ? chain[chain.length - 1] : null;
        if (anchor) {
          realLocalToWorld(anchor.local, anchor.rank, anchor.part, worldB);
          paintDimension(previewDim, worldB, worldA);
        } else {
          hideDimension(previewDim);
        }
      } else {
        previewMarker.visible = false;
        hideDimension(previewDim);
      }
      if (!measuring || !previewSample) {
        snapEl.hidden = true;
      } else {
        realLocalToWorld(previewSample.local, previewSample.rank, previewSample.part, worldA);
        const ndc = worldA.clone().project(camera);
        if (ndc.z < -1 || ndc.z > 1) {
          snapEl.hidden = true;
        } else {
          snapEl.hidden = false;
          snapEl.style.left = ((ndc.x * 0.5 + 0.5) * innerWidth) + "px";
          snapEl.style.top = ((-ndc.y * 0.5 + 0.5) * innerHeight) + "px";
          snapEl.classList.toggle("locked", snapLocked);
          const anchor = !breakChain && chain.length ? chain[chain.length - 1] : null;
          if (anchor) {
            realLocalToWorld(anchor.local, anchor.rank, anchor.part, worldB);
            const length = worldA.distanceTo(worldB);
            snapText.textContent = length < 0.002 ? (snapLocked ? "Điểm cuối" : "Mặt") : (snapLocked ? "Điểm cuối · " : "") + formatMeters(length);
          } else {
            snapText.textContent = snapLocked ? "Điểm cuối" : "Mặt";
          }
        }
      }
    }

    function clearMeasures() {
      for (const spot of spots) {
        scene.remove(spot.marker);
        scene.remove(spot.leader);
        spot.label.remove();
      }
      for (const dim of dims) {
        for (const stroke of dim.graphic.strokes) scene.remove(stroke);
        dim.graphic.lengthLabel.remove();
        dim.graphic.heightLabel.remove();
      }
      spots.length = 0;
      dims.length = 0;
      chain.length = 0;
      dimDraft = null;
      placeCursor = null;
      breakChain = false;
      panelKey = "";
      updateMeasureGraphics();
      fillMeasurePanel();
    }

    measureToggle.addEventListener("click", () => {
      measuring = !measuring;
      measureToggle.setAttribute("aria-pressed", measuring ? "true" : "false");
      measurePanel.hidden = !measuring;
      hint.textContent = measuring
        ? "Đo: điểm đầu, điểm cuối, rồi chỗ đặt đường kích thước. Shift khóa vuông góc. Chuột phải để xoay."
        : "Kéo để xoay · cuộn để phóng · bấm một cấu kiện";
      renderer.domElement.style.cursor = measuring ? "crosshair" : "";
      controls.mouseButtons.LEFT = measuring ? -1 : THREE.MOUSE.ROTATE;
      controls.mouseButtons.RIGHT = measuring ? THREE.MOUSE.ROTATE : THREE.MOUSE.PAN;
      if (!measuring) {
        previewSample = null;
        dimDraft = null;
        placeCursor = null;
        snapLocked = false;
        snapEl.hidden = true;
        hoverGuid = null;
        applyTint();
      }
      panelKey = "";
      fillMeasurePanel();
    });
    document.getElementById("measure-break").addEventListener("click", () => {
      dimDraft = null;
      placeCursor = null;
      chain.length = 0;
      breakChain = true;
      panelKey = "";
      updateMeasureGraphics();
      fillMeasurePanel();
    });
    document.getElementById("measure-clear").addEventListener("click", clearMeasures);
    document.getElementById("detail-close").addEventListener("click", () => {
      clearSelection();
      applyTint();
    });
    renderer.domElement.addEventListener("contextmenu", (event) => {
      event.preventDefault();
    });

    let pointerDown = null;
    renderer.domElement.addEventListener("pointerdown", (event) => {
      dragging = true;
      flying = null;
      pointerDown = { x: event.clientX, y: event.clientY, button: event.button };
    });
    renderer.domElement.addEventListener("pointerup", (event) => {
      dragging = false;
      if (!pointerDown || event.button !== 0) return;
      const moved = Math.hypot(event.clientX - pointerDown.x, event.clientY - pointerDown.y);
      pointerDown = null;
      if (moved > (measuring ? 12 : 5)) return;
      if (measuring && dimDraft) {
        const origin = new THREE.Vector3();
        realLocalToWorld(dimDraft.a.local, dimDraft.a.rank, dimDraft.a.part, origin);
        const end = new THREE.Vector3();
        realLocalToWorld(dimDraft.b.local, dimDraft.b.rank, dimDraft.b.part, end);
        const cursor = pointOnViewPlane(event, origin.clone().lerp(end, 0.5));
        const placed = placementOf(origin, end, cursor);
        if (placed) {
          dims.push({
            a: dimDraft.a,
            b: dimDraft.b,
            side: placed.side,
            distance: placed.distance,
            graphic: makeDimension(),
          });
        }
        dimDraft = null;
        placeCursor = null;
        chain.length = 0;
        panelKey = "";
        updateMeasureGraphics();
        fillMeasurePanel();
        return;
      }
      const hit = raycast(event);
      if (measuring) {
        if (!hit) return;
        const snapped = snapWorldPoint(hit.point, hit.item, event.clientX, event.clientY);
        let point = snapped.point;
        if (event.shiftKey && chain.length === 1) {
          const origin = new THREE.Vector3();
          realLocalToWorld(chain[0].local, chain[0].rank, chain[0].part, origin);
          point = orthoPoint(origin, point);
        }
        const sample = sampleFromWorld(point, hit.item);
        if (breakChain) {
          chain.length = 0;
          breakChain = false;
        }
        chain.push(sample);
        spots.push({ sample, marker: makeMarker(snapped.snapped), label: makeLabel(), leader: makeBar(1) });
        if (chain.length >= 2) dimDraft = { a: chain[chain.length - 2], b: chain[chain.length - 1] };
        panelKey = "";
        updateMeasureGraphics();
        fillMeasurePanel();
        return;
      }
      if (!hit) {
        clearSelection();
        applyTint();
        return;
      }
      selectedGuid = hit.item.key;
      hoverGuid = null;
      showDetail(hit.item.key);
      applyTint();
    });
    let hoverEvent = null;
    let hoverQueued = false;
    renderer.domElement.addEventListener("pointermove", (event) => {
      if (dragging || !items.length) return;
      hoverEvent = { clientX: event.clientX, clientY: event.clientY, shiftKey: event.shiftKey };
      if (hoverQueued) return;
      hoverQueued = true;
      requestAnimationFrame(() => {
        hoverQueued = false;
        if (!hoverEvent || dragging) return;
        if (measuring) {
          if (dimDraft) {
            const origin = new THREE.Vector3();
            const end = new THREE.Vector3();
            realLocalToWorld(dimDraft.a.local, dimDraft.a.rank, dimDraft.a.part, origin);
            realLocalToWorld(dimDraft.b.local, dimDraft.b.rank, dimDraft.b.part, end);
            placeCursor = pointOnViewPlane(hoverEvent, origin.clone().lerp(end, 0.5));
            previewSample = null;
            snapLocked = false;
          } else {
            const hit = raycast(hoverEvent);
            previewSample = null;
            snapLocked = false;
            if (hit) {
              const snapped = snapWorldPoint(hit.point, hit.item, hoverEvent.clientX, hoverEvent.clientY);
              let point = snapped.point;
              if (hoverEvent.shiftKey && chain.length === 1) {
                const origin = new THREE.Vector3();
                realLocalToWorld(chain[0].local, chain[0].rank, chain[0].part, origin);
                point = orthoPoint(origin, point);
              }
              previewSample = sampleFromWorld(point, hit.item);
              snapLocked = snapped.snapped;
              previewMarker.material.color.setHex(snapped.snapped ? 0xffc857 : 0xd7e7f6);
            }
          }
          renderer.domElement.style.cursor = "crosshair";
          updateMeasureGraphics();
          fillMeasurePanel();
          return;
        }
        const hit = raycast(hoverEvent);
        const next = hit ? hit.item.key : null;
        if (next === hoverGuid) return;
        hoverGuid = next;
        renderer.domElement.style.cursor = next ? "pointer" : "";
        applyTint();
      });
    });

    document.getElementById("views").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      isolatedGuid = null;
      applyVisibility();
      showView(button.dataset.view);
    });
    explode.addEventListener("input", () => {
      targetGap = Number(explode.value);
      explodeToggle.setAttribute("aria-pressed", targetGap > 0.4 ? "true" : "false");
    });
    const filters = document.getElementById("filters");
    const layersToggle = document.getElementById("layers-toggle");
    layersToggle.addEventListener("click", () => {
      const hidden = filters.classList.toggle("hidden");
      layersToggle.setAttribute("aria-pressed", hidden ? "false" : "true");
    });
    function frameLayers() {
      const box = visibleBox(Number(explode.value));
      if (box) flyToBox(box);
    }
    explodeToggle.addEventListener("click", () => {
      explode.value = targetGap > 0.4 ? "0" : "8";
      explode.dispatchEvent(new Event("input"));
      frameLayers();
    });
    explode.addEventListener("change", frameLayers);
    onlyButton.addEventListener("click", () => {
      if (!selectedGuid) return;
      isolatedGuid = isolatedGuid === selectedGuid ? null : selectedGuid;
      applyVisibility();
      onlyButton.textContent = isolatedGuid ? "Hiện lại tất cả" : "Chỉ hiện cấu kiện này";
      const box = visibleBox(gap);
      if (box) flyToBox(box);
      for (const button of document.querySelectorAll("#views button")) button.setAttribute("aria-pressed", "false");
    });
    addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        if (measuring && (dimDraft || chain.length)) {
          dimDraft = null;
          placeCursor = null;
          chain.length = 0;
          const kept = new Set();
          for (const dim of dims) {
            kept.add(dim.a);
            kept.add(dim.b);
          }
          for (let index = spots.length - 1; index >= 0; index -= 1) {
            if (kept.has(spots[index].sample)) continue;
            scene.remove(spots[index].marker);
            scene.remove(spots[index].leader);
            spots[index].label.remove();
            spots.splice(index, 1);
          }
          panelKey = "";
          updateMeasureGraphics();
          fillMeasurePanel();
          return;
        }
        if (measuring) {
          measureToggle.click();
          return;
        }
        clearSelection();
        applyTint();
      }
    });

    const loader = new GLTFLoader();
    Promise.all([
      fetch("QL1A-meta.json").then((response) => response.json()),
      ...MODEL_FILES.map(([id, file]) => new Promise((resolve, reject) => {
        loader.load(file, (gltf) => resolve([id, gltf]), undefined, reject);
      })),
    ]).then(async (results) => {
      try {
        meta = results[0];
        const meshes = [];
        for (const [id, gltf] of results.slice(1)) {
          gltf.scene.updateMatrixWorld(true);
          gltf.scene.traverse((node) => {
            if (!node.isMesh) return;
            node.userData.modelId = id;
            meshes.push(node);
          });
        }
        status.textContent = "Đang ghép mô hình…";
        buildBatches(meshes);
        const keys = new Set(items.map((item) => item.key));
        const storeyNames = new Set(items.map((item) => (meta[item.key] || {}).storey || "Khác"));
        const storeys = [...storeyNames].sort((a, b) => {
          const ia = STOREY_ORDER.indexOf(a);
          const ib = STOREY_ORDER.indexOf(b);
          const ra = ia < 0 ? 100 : ia;
          const rb = ib < 0 ? 100 : ib;
          return ra - rb || a.localeCompare(b, "vi");
        });
        const present = new Set(items.map((item) => (meta[item.key] || {}).classLabel || item.kind));
        const kinds = KIND_ORDER.filter((name) => present.has(name));
        for (const name of present) if (!kinds.includes(name)) kinds.push(name);
        chips(document.getElementById("models"), MODEL_ORDER, modelOn, (name) => MODEL_LABEL[name], (item) => item.model, (name) => name !== "HienTrang", (name) => LAYER_HEX[name]);
        chips(document.getElementById("storeys"), storeys, storeyOn, storeyLabel, (item) => (meta[item.key] || {}).storey || "Khác");
        chips(document.getElementById("kinds"), kinds, kindOn, (name) => name, (item) => (meta[item.key] || {}).classLabel || item.kind, null, (name) => KIND_HEX[name] || "#7d8b98");
        applyVisibility();
        home = visibleBox(0);
        const center = home.getCenter(new THREE.Vector3());
        grid.position.set(center.x, home.min.y - 0.04, center.z);
        grid.material.uniforms.uOrigin.value.set(center.x, center.z);
        camera.position.copy(center).add(viewOffset("orbit", home));
        controls.target.copy(center);
        controls.update();
        status.textContent = keys.size.toLocaleString("vi-VN") + " cấu kiện trên 7 lớp. Gạt lớp để hiện tuyến, cầu, cống, chiếu sáng.";
      } catch (error) {
        status.textContent = "Không ghép được mô hình.";
        console.error(error);
      }
    }).catch((error) => {
      status.textContent = "Không tải được mô hình.";
      console.error(error);
    });

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const delta = Math.min(clock.getDelta(), 0.05);
      if (Math.abs(targetGap - gap) > 0.001) {
        gap = reduceMotion ? targetGap : gap + (targetGap - gap) * Math.min(1, delta * 7);
        if (Math.abs(targetGap - gap) < 0.01) gap = targetGap;
        applyGap(gap);
      }
      if (flying) {
        flying.t += delta / 0.85;
        const t = ease(Math.min(flying.t, 1));
        camera.position.lerpVectors(flying.from, flying.to, t);
        controls.target.lerpVectors(flying.fromTarget, flying.toTarget, t);
        if (flying.t >= 1) flying = null;
      } else {
        controls.update();
      }
      updateMeasureGraphics();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
